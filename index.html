<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="習慣">
<title>習慣トラッカー</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1d1f23;
    --muted: #6b7280;
    --accent: #2f7de1;
    --done: #22a06b;
    --line: #e5e7eb;
    --danger: #d64545;
    --star: #f0b429;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171c;
      --card: #1f2229;
      --text: #eceef2;
      --muted: #9aa1ad;
      --accent: #5a9cf0;
      --done: #34c08a;
      --line: #2e323b;
      --danger: #ef6161;
      --star: #f5c451;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171c;
    --card: #1f2229;
    --text: #eceef2;
    --muted: #9aa1ad;
    --accent: #5a9cf0;
    --done: #34c08a;
    --line: #2e323b;
    --danger: #ef6161;
    --star: #f5c451;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; padding-bottom: 130px; }
  h1 { font-size: 20px; margin: 8px 0 14px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .muted { color: var(--muted); font-size: 14px; }

  /* 今日の達成率 */
  .rate-row { display: flex; align-items: baseline; gap: 10px; }
  .rate { font-size: 44px; font-weight: 700; color: var(--accent); line-height: 1; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; width: 0; background: var(--done); transition: width .3s; }

  /* 習慣・ToDoのリスト */
  .habit {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
  }
  .habit:last-child { border-bottom: none; }
  .check {
    width: 28px; height: 28px; flex: none;
    border-radius: 50%;
    border: 2px solid var(--muted);
    display: grid; place-items: center;
    color: #fff; font-size: 15px; font-weight: 700;
  }
  .habit.done .check { background: var(--done); border-color: var(--done); }
  .habit.done .name { color: var(--muted); text-decoration: line-through; }
  .name { flex: 1; word-break: break-all; }
  .tag { display: inline-block; margin-left: 6px; font-size: 12px; color: var(--accent); text-decoration: none; }
  .edit-tools { display: none; gap: 6px; }
  .editing .edit-tools { display: flex; }
  .editing .habit { cursor: default; }
  .mini {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    width: 34px; height: 34px;
    font-size: 14px;
    cursor: pointer;
  }
  .mini.del { color: var(--danger); }
  .mini:disabled { opacity: .35; cursor: default; }

  /* 目標 */
  .goal-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .goal-item:last-child { border-bottom: none; }
  .goal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .goal-title { font-weight: 700; word-break: break-all; }
  .stars { display: flex; gap: 2px; margin-top: 6px; }
  .stars button {
    border: none; background: none; padding: 0 2px;
    font-size: 22px; line-height: 1; color: var(--line); cursor: pointer;
  }
  .stars button.on { color: var(--star); }
  .metric { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .metric .num-input { width: 76px; padding: 8px; }
  .metric .g-unit { width: 56px; }
  .g-result { margin-top: 10px; font-weight: 700; }
  .g-result.ok { color: var(--done); }
  .g-result.ng { color: var(--danger); }
  .g-auto { margin-top: 4px; font-size: 13px; }
  #review-score { font-weight: 700; margin: 0 0 4px; }
  .field-label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 4px; }
  textarea {
    width: 100%;
    min-height: 72px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    resize: vertical;
  }

  /* ボタン・入力 */
  .btn {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    cursor: pointer;
  }
  .btn.ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
  }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .stack input[type="text"] { flex: none; width: 100%; }
  input[type="text"] {
    flex: 1 1 0; width: 0; min-width: 0;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  .sel {
    flex: 1 1 0; width: 0; min-width: 0;
    padding: 10px 8px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  .empty { text-align: center; padding: 20px 0; color: var(--muted); }

  /* グラフ */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button {
    border: none; background: transparent; color: var(--muted);
    padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #fff; }
  .chart-box { position: relative; height: 240px; margin-top: 12px; }
  .summary { display: flex; gap: 16px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .summary b { color: var(--text); font-size: 18px; }

  /* カレンダー */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head b { font-size: 16px; }
  .cal-nav {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    width: 40px; height: 34px;
    font-size: 18px;
    cursor: pointer;
  }
  .cal-nav:disabled { opacity: .35; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-grid > * { min-width: 0; justify-self: stretch; }
  .cal-wd { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0; }
  .cal-day {
    display: block;
    width: 100%;
    min-width: 0;
    height: 44px;
    -webkit-appearance: none;
    appearance: none;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 0;
    cursor: pointer;
  }
  .cal-day:disabled { color: var(--muted); opacity: .4; cursor: default; }
  .cal-day.lv1 { background: rgba(34, 160, 107, .2); }
  .cal-day.lv2 { background: rgba(34, 160, 107, .45); }
  .cal-day.lv3 { background: var(--done); color: #fff; }
  .cal-day.today { font-weight: 700; border-color: var(--accent); }
  .cal-day.sel { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* タイマー */
  .timer-btn { width: auto; padding: 0 8px; font-size: 13px; white-space: nowrap; color: var(--accent); }
  .num-input {
    width: 64px; flex: none;
    padding: 10px 8px;
    font-size: 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  #timer-panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--card);
    border-top: 1px solid var(--line);
    box-shadow: 0 -4px 16px rgba(0, 0, 0, .12);
  }
  #timer-panel[hidden] { display: none; }
  #timer-name { font-size: 14px; color: var(--muted); word-break: break-all; }
  #timer-time { font-size: 30px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="err-banner" hidden style="position: fixed; top: 0; left: 0; right: 0; z-index: 99; padding: 8px 12px; background: #d64545; color: #fff; font-size: 13px; white-space: pre-wrap;"></div>
<script>
  // 途中でエラーが起きたら画面上部に表示する（原因の確認用）
  function showError(msg) {
    const b = document.getElementById("err-banner");
    b.hidden = false;
    b.textContent = "エラー: " + msg;
  }
  window.addEventListener("error", e => showError(`${e.message} (${e.lineno}行目)`));
  window.addEventListener("unhandledrejection", e => showError(String(e.reason)));
</script>
<div class="wrap">
  <h1 id="today-label">今日</h1>

  <section class="card">
    <h2 id="goal-heading">今年の目標</h2>
    <div id="goal-list"></div>
    <form id="goal-form" class="stack">
      <input type="text" id="goal-title" maxlength="60" placeholder="目標（例: 英語で仕事ができるようになる）">
      <input type="text" id="goal-why" maxlength="120" placeholder="なぜ大事か（任意）">
      <button class="btn" type="submit">目標を追加</button>
    </form>
  </section>

  <section class="card">
    <div class="cal-head">
      <button class="cal-nav" id="prev-month" aria-label="前の月">‹</button>
      <b id="cal-title"></b>
      <button class="cal-nav" id="next-month" aria-label="次の月">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <p class="muted" style="margin: 10px 0 0;">日付をタップすると、その日の記録を見たり直したりできます。色が濃いほど達成率が高い日です。</p>
  </section>

  <section class="card">
    <div class="rate-row">
      <span class="rate" id="rate">0%</span>
      <span class="muted" id="rate-detail"></span>
    </div>
    <div class="bar"><div id="bar"></div></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <h2 style="margin: 0;" id="habit-title">今日の習慣</h2>
      <div class="row" style="gap: 6px;">
        <button class="btn small" id="to-today" hidden>今日に戻る</button>
        <button class="btn ghost small" id="edit-toggle">並べ替え・削除</button>
      </div>
    </div>
    <div id="habit-list"></div>
    <form id="add-form" class="row" style="margin-top: 12px;">
      <input type="text" id="new-name" maxlength="40" placeholder="新しい習慣を追加（例: 読書）" style="flex: 1 1 100%;">
      <select id="new-goal" class="sel" aria-label="関連する目標"></select>
      <input type="number" id="new-minutes" class="num-input" min="1" max="600" inputmode="numeric" placeholder="分">
      <button class="btn" type="submit" style="flex: none;">追加</button>
    </form>
  </section>

  <section class="card">
    <h2 id="todo-title">今日のToDo</h2>
    <div id="todo-list"></div>
    <form id="todo-form" class="row" style="margin-top: 12px; flex-wrap: nowrap; min-width: 0;">
      <input type="text" id="todo-name" maxlength="60" placeholder="やることを追加（例: 病院に電話）">
      <button class="btn" type="submit" style="flex: none;">追加</button>
    </form>
    <p class="muted" style="margin: 10px 0 0;">ToDoはその日だけのタスクです。達成率には含まれません。</p>
  </section>

  <section class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 4px;">
      <h2 style="margin: 0;">達成率の推移</h2>
      <div class="seg" id="range">
        <button data-days="7">7日</button>
        <button data-days="30" class="on">30日</button>
      </div>
    </div>
    <div class="chart-box" id="chart-box"></div>
    <div class="summary">
      <div>平均 <b id="avg">0%</b></div>
      <div>記録した日 <b id="recorded">0</b>日</div>
    </div>
  </section>

  <section class="card">
    <h2>3ヶ月ごとの振り返り</h2>
    <div class="seg" id="review-q">
      <button data-q="1">1期</button>
      <button data-q="2">2期</button>
      <button data-q="3">3期</button>
      <button data-q="4">4期</button>
    </div>
    <div id="review-title" style="font-weight: 700; margin: 12px 0 0;"></div>
    <div class="summary">
      <div>習慣の平均 <b id="review-avg">0%</b></div>
      <div>記録した日 <b id="review-days">0</b>日</div>
    </div>
    <div class="chart-box" id="review-chart"></div>

    <h2 style="margin-top: 16px;">目標と実績</h2>
    <p id="review-score"></p>
    <div id="review-goals"></div>

    <label class="field-label" for="rv-good">この期間に良かったこと</label>
    <textarea id="rv-good"></textarea>
    <label class="field-label" for="rv-issues">うまくいかなかったこと</label>
    <textarea id="rv-issues"></textarea>
    <label class="field-label" for="rv-next">次の3ヶ月でやること</label>
    <textarea id="rv-next"></textarea>
  </section>

  <section class="card">
    <h2>バックアップ</h2>
    <p class="muted" style="margin: 0 0 12px;">データはこの端末のブラウザに保存されます。機種変更や消去に備えて、時々書き出してください。</p>
    <div class="row">
      <button class="btn ghost small" id="export">書き出し（JSON保存）</button>
      <button class="btn ghost small" id="import-btn">読み込み</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>
  </section>
</div>

<p class="muted" style="text-align: center; margin: 24px 0 0; font-size: 12px;">版: 2026-11-03 カレンダー修正 v5</p>

<div id="timer-panel" hidden>
  <div>
    <div id="timer-name"></div>
    <div id="timer-time">00:00</div>
  </div>
  <div class="row" style="gap: 6px;">
    <button class="btn ghost small" id="timer-pause">一時停止</button>
    <button class="btn small" id="timer-stop">終了</button>
  </div>
</div>

<script>
(() => {
  const KEY = "habitTracker.v1";
  const TIMER_KEY = "habitTracker.timer";
  const DAY_MS = 24 * 60 * 60 * 1000;
  const THIS_YEAR = new Date().getFullYear();
  const WEEK = ["日", "月", "火", "水", "木", "金", "土"];

  // ---------- データ ----------
  // habits: [{ id, name, minutes?, goalId? }]
  // records: { "2026-11-03": { "habitId": true, ... } }
  // todos: { "2026-11-03": [{ id, name, done }] }
  // goals: [{ id, title, why, year }]
  // reviews: { "2026-Q4": { good, issues, next, ratings: { goalId: 1〜5 } } }
  let state = load();
  let editing = false;
  let chartDays = 30;
  let selectedKey = null;
  let viewYear = 0;
  let viewMonth = 0;
  let reviewQuarter = Math.floor(new Date().getMonth() / 3) + 1;
  // タイマー: { habitId, name, key, endAt（動作中の終了時刻）, remainMs（一時停止中の残り時間） }
  let timer = loadTimer();
  let audioCtx = null;

  function load() {
    let s = null;
    try {
      s = JSON.parse(localStorage.getItem(KEY));
    } catch (e) { /* 読めなければ空から始める */ }
    if (!s || !Array.isArray(s.habits) || !s.records) s = { habits: [], records: {} };
    return normalize(s);
  }

  // 古いデータにも新しい項目を用意する
  function normalize(s) {
    s.todos = s.todos || {};
    s.goals = s.goals || [];
    s.reviews = s.reviews || {};
    return s;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      alert("保存できませんでした。書き出しでバックアップを取ってください。");
    }
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // ---------- 日付 ----------
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayKey = () => keyOf(new Date());
  const dayAgo = n => keyOf(new Date(Date.now() - n * DAY_MS));
  const shortLabel = key => {
    const [, m, d] = key.split("-").map(Number);
    return `${m}/${d}`;
  };

  // "2026-11-03" → "2026年11月3日(火)"
  function labelOf(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("ja-JP", {
      year: "numeric", month: "long", day: "numeric", weekday: "short",
    });
  }

  // 四半期（1期: 1〜3月 ...）の、今日までの日付一覧
  function quarterKeys(q) {
    const start = new Date(THIS_YEAR, (q - 1) * 3, 1);
    const end = new Date(THIS_YEAR, q * 3, 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const keys = [];
    for (let d = new Date(start); d <= end && d <= today; d.setDate(d.getDate() + 1)) {
      keys.push(keyOf(d));
    }
    return keys;
  }

  // ---------- 計算 ----------
  function doneCount(key) {
    const rec = state.records[key] || {};
    return state.habits.filter(h => rec[h.id]).length;
  }

  // その日の達成率（習慣が0件のときは null）
  function rateOf(key) {
    const total = state.habits.length;
    if (total === 0) return null;
    return Math.round((doneCount(key) / total) * 100);
  }

  function hasRecord(key) {
    return Object.keys(state.records[key] || {}).length > 0;
  }

  // カレンダーの色の濃さ（0: 色なし, 1〜3: 薄い〜濃い）
  function levelOf(key) {
    const rate = rateOf(key);
    if (rate === null || !hasRecord(key)) return 0;
    if (rate >= 100) return 3;
    if (rate >= 50) return 2;
    return rate > 0 ? 1 : 0;
  }

  // 関連する習慣を期間内に完了した回数（習慣ごとの完了日数の合計）。関連する習慣がなければ null
  function completionsFor(goalId, keys) {
    const habits = state.habits.filter(h => h.goalId === goalId);
    if (habits.length === 0) return null;
    let count = 0;
    keys.forEach(k => {
      const rec = state.records[k] || {};
      habits.forEach(h => { if (rec[h.id]) count++; });
    });
    return count;
  }

  // 目標の数値。実績は手入力、なければ関連する習慣の完了回数を使う。
  // 「減らす」目標（体重など）は、目標値以下で達成。開始値を入れると、開始から目標までの進み具合（%）を出す。
  function goalResult(goal, keys) {
    const rv = state.reviews[reviewKey()] || {};
    const m = (rv.metrics || {})[goal.id] || {};
    const autoCount = completionsFor(goal.id, keys);
    const manual = m.actual !== undefined && m.actual !== "";
    const actual = manual ? Number(m.actual) : autoCount;
    const hasTarget = m.target !== undefined && m.target !== "";
    const target = Number(m.target);
    const hasStart = m.start !== undefined && m.start !== "";
    const start = Number(m.start);
    const down = m.direction === "down";

    const ok = hasTarget && actual !== null ? (down ? actual <= target : actual >= target) : null;

    let pct = null;
    if (hasTarget && actual !== null) {
      if (hasStart) {
        pct = target === start ? (ok ? 100 : 0) : Math.round(((actual - start) / (target - start)) * 100);
      } else if (!down && target > 0) {
        pct = Math.round((actual / target) * 100);
      }
    }

    // 目標まであと何か（達成していない場合）
    const remain = ok === false ? Math.abs(actual - target) : null;

    return { unit: m.unit || "回", down, autoCount, manual, actual, target, hasTarget, ok, pct, remain };
  }

  function currentGoals() {
    return state.goals.filter(g => g.year === THIS_YEAR);
  }

  function goalOf(habit) {
    return state.goals.find(g => g.id === habit.goalId);
  }

  // ---------- 描画: 今日の習慣 ----------
  function renderToday() {
    const key = selectedKey;
    const isToday = key === todayKey();
    const total = state.habits.length;
    const done = doneCount(key);
    const rate = rateOf(key) ?? 0;

    document.getElementById("today-label").textContent = labelOf(key);
    document.getElementById("habit-title").textContent = isToday ? "今日の習慣" : "この日の習慣";
    document.getElementById("to-today").hidden = isToday;

    document.getElementById("rate").textContent = `${rate}%`;
    document.getElementById("rate-detail").textContent =
      total === 0 ? "習慣を追加しましょう" : `習慣 ${total}個中 ${done}個 完了`;
    document.getElementById("bar").style.width = `${rate}%`;

    const list = document.getElementById("habit-list");
    list.className = editing ? "editing" : "";
    list.innerHTML = "";

    if (total === 0) {
      list.innerHTML = `<div class="empty">まだ習慣がありません。下から追加してください。</div>`;
      return;
    }

    const rec = state.records[key] || {};
    state.habits.forEach((h, i) => {
      const row = document.createElement("div");
      row.className = "habit" + (rec[h.id] ? " done" : "");

      const check = document.createElement("span");
      check.className = "check";
      check.textContent = rec[h.id] ? "✓" : "";

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = h.name;
      const goal = goalOf(h);
      if (goal) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = `🎯 ${goal.title}`;
        name.append(tag);
      }

      row.append(check, name);

      if (editing) {
        const tools = document.createElement("span");
        tools.className = "edit-tools";
        tools.append(
          miniButton("▲", i === 0, () => move(i, -1)),
          miniButton("▼", i === total - 1, () => move(i, 1)),
          miniButton("⏱", false, () => setMinutes(h.id)),
          miniButton("🎯", false, () => setGoal(h.id)),
          miniButton("✕", false, () => remove(h.id), "del")
        );
        row.append(tools);
      } else {
        if (h.minutes) row.append(timerButton(h));
        row.addEventListener("click", () => toggle(h.id));
      }
      list.append(row);
    });
  }

  function miniButton(label, disabled, onClick, extraClass = "") {
    const b = document.createElement("button");
    b.className = "mini " + extraClass;
    b.textContent = label;
    b.disabled = disabled;
    b.addEventListener("click", e => { e.stopPropagation(); onClick(); });
    return b;
  }

  // ---------- 描画: 達成率の推移 ----------
  // labels と values を、SVGの折れ線グラフとして el に描く
  function drawLine(el, labels, values) {
    if (values.length === 0) {
      el.innerHTML = `<div class="empty">この期間はまだ始まっていません</div>`;
      return;
    }
    const W = 320, H = 220, PL = 36, PR = 10, PT = 10, PB = 26;
    const x = i => PL + (values.length === 1 ? (W - PL - PR) / 2 : i * (W - PL - PR) / (values.length - 1));
    const y = v => PT + (1 - v / 100) * (H - PT - PB);
    const step = Math.ceil(values.length / 6);

    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" role="img" aria-label="達成率の推移">`;
    [0, 50, 100].forEach(v => {
      svg += `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" style="stroke: var(--line)"/>`;
      svg += `<text x="${PL - 6}" y="${y(v) + 4}" text-anchor="end" style="fill: var(--muted); font-size: 11px">${v}%</text>`;
    });
    labels.forEach((label, i) => {
      if (i % step === 0 || i === labels.length - 1) {
        svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" style="fill: var(--muted); font-size: 11px">${label}</text>`;
      }
    });
    const points = values.map((v, i) => `${x(i)},${y(v)}`).join(" ");
    svg += `<polyline points="${points}" fill="none" stroke-width="2" stroke-linejoin="round" style="stroke: var(--accent)"/>`;
    values.forEach((v, i) => {
      svg += `<circle cx="${x(i)}" cy="${y(v)}" r="${values.length > 40 ? 1.5 : 3}" style="fill: var(--accent)"/>`;
    });
    svg += `</svg>`;
    el.innerHTML = svg;
  }

  function renderChart() {
    const keys = [];
    for (let n = chartDays - 1; n >= 0; n--) keys.push(dayAgo(n));

    const recorded = keys.filter(hasRecord);
    const avg = recorded.length
      ? Math.round(recorded.reduce((a, k) => a + (rateOf(k) ?? 0), 0) / recorded.length)
      : 0;
    document.getElementById("avg").textContent = `${avg}%`;
    document.getElementById("recorded").textContent = recorded.length;

    drawLine(document.getElementById("chart-box"), keys.map(shortLabel), keys.map(k => rateOf(k) ?? 0));
  }

  // ---------- 描画: 3ヶ月ごとの振り返り ----------
  function reviewKey() {
    return `${THIS_YEAR}-Q${reviewQuarter}`;
  }

  function reviewFor(key) {
    state.reviews[key] = state.reviews[key] || { ratings: {} };
    return state.reviews[key];
  }

  function renderReview() {
    const keys = quarterKeys(reviewQuarter);
    document.querySelectorAll("#review-q button").forEach(btn => {
      btn.classList.toggle("on", Number(btn.dataset.q) === reviewQuarter);
    });

    const startMonth = (reviewQuarter - 1) * 3 + 1;
    document.getElementById("review-title").textContent =
      `${THIS_YEAR}年 ${reviewQuarter}期（${startMonth}〜${startMonth + 2}月）`;

    const recorded = keys.filter(hasRecord);
    const avg = recorded.length
      ? Math.round(recorded.reduce((a, k) => a + (rateOf(k) ?? 0), 0) / recorded.length)
      : 0;
    document.getElementById("review-avg").textContent = `${avg}%`;
    document.getElementById("review-days").textContent = recorded.length;
    drawLine(document.getElementById("review-chart"), keys.map(shortLabel), keys.map(k => rateOf(k) ?? 0));

    const rv = state.reviews[reviewKey()] || { ratings: {} };
    const box = document.getElementById("review-goals");
    box.innerHTML = "";
    const goals = currentGoals();
    if (goals.length === 0) {
      box.innerHTML = `<div class="empty">目標を登録すると、ここで振り返れます。</div>`;
    }
    goals.forEach(g => {
      const m = (rv.metrics || {})[g.id] || {};
      const item = document.createElement("div");
      item.className = "goal-item";

      const title = document.createElement("div");
      title.className = "goal-title";
      title.textContent = g.title;

      // 目標値・単位・実績を入力する行
      const metric = document.createElement("div");
      metric.className = "metric";
      metric.innerHTML = `
        <select class="sel g-dir" aria-label="目標の向き">
          <option value="up">増やす</option>
          <option value="down">減らす</option>
        </select>
        <span>目標</span>
        <input type="number" class="num-input g-target" inputmode="decimal" aria-label="目標値">
        <input type="text" class="num-input g-unit" maxlength="6" aria-label="単位">
        <span>実績</span>
        <input type="number" class="num-input g-actual" inputmode="decimal" aria-label="実績">
        <span>開始</span>
        <input type="number" class="num-input g-start" inputmode="decimal" placeholder="任意" aria-label="開始時の値">`;
      const dirSelect = metric.querySelector(".g-dir");
      const targetInput = metric.querySelector(".g-target");
      const unitInput = metric.querySelector(".g-unit");
      const actualInput = metric.querySelector(".g-actual");
      const startInput = metric.querySelector(".g-start");
      dirSelect.value = m.direction || "up";
      targetInput.value = m.target ?? "";
      unitInput.value = m.unit || "回";
      actualInput.value = m.actual ?? "";
      startInput.value = m.start ?? "";

      const bar = document.createElement("div");
      bar.className = "bar";
      const fill = document.createElement("div");
      fill.className = "g-fill";
      bar.append(fill);

      const result = document.createElement("div");
      result.className = "g-result";
      const auto = document.createElement("div");
      auto.className = "g-auto muted";

      const stars = document.createElement("div");
      stars.className = "stars";
      const current = (rv.ratings && rv.ratings[g.id]) || 0;
      for (let n = 1; n <= 5; n++) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = "★";
        b.setAttribute("aria-label", `進み具合 ${n}`);
        if (current >= n) b.classList.add("on");
        b.addEventListener("click", () => setRating(g.id, n));
        stars.append(b);
      }

      item.append(title, metric, bar, result, auto, stars);
      box.append(item);

      // 入力のたびに、保存して達成率を更新する（描き直すと入力が途切れるため、行は作り直さない）
      const onChange = (field, input, eventName = "input") => input.addEventListener(eventName, () => {
        setMetric(g.id, field, input.value);
        paintGoal(item, g, keys);
        paintScore(keys);
      });
      onChange("direction", dirSelect, "change");
      onChange("target", targetInput);
      onChange("unit", unitInput);
      onChange("actual", actualInput);
      onChange("start", startInput);
      paintGoal(item, g, keys);
    });
    paintScore(keys);

    document.getElementById("rv-good").value = rv.good || "";
    document.getElementById("rv-issues").value = rv.issues || "";
    document.getElementById("rv-next").value = rv.next || "";
  }

  function setRating(goalId, n) {
    const rv = reviewFor(reviewKey());
    rv.ratings[goalId] = rv.ratings[goalId] === n ? 0 : n;
    save();
    renderReview();
  }

  function setMetric(goalId, field, value) {
    const rv = reviewFor(reviewKey());
    rv.metrics = rv.metrics || {};
    rv.metrics[goalId] = rv.metrics[goalId] || {};
    rv.metrics[goalId][field] = value;
    save();
  }

  // 目標ごとの達成率・判定・自動の完了回数を表示に反映する
  function paintGoal(item, goal, keys) {
    const r = goalResult(goal, keys);
    const fill = item.querySelector(".g-fill");
    const result = item.querySelector(".g-result");
    const auto = item.querySelector(".g-auto");
    const actualInput = item.querySelector(".g-actual");

    actualInput.placeholder = r.autoCount === null ? "実績" : String(r.autoCount);
    fill.style.width = `${Math.min(Math.max(r.pct ?? 0, 0), 100)}%`;

    if (!r.hasTarget) {
      result.textContent = "目標値を入れると、達成率が出ます";
      result.className = "g-result muted";
    } else if (r.actual === null) {
      result.textContent = "実績を入れてください";
      result.className = "g-result muted";
    } else {
      const label = r.ok ? "達成" : r.pct !== null && r.pct >= 50 ? "一部達成" : "未達";
      const percent = r.pct === null ? "" : `${r.pct}%・`;
      const rest = r.ok ? "" : `・目標まであと${r.remain}${r.unit}`;
      result.textContent = `${r.actual} / ${r.target}${r.unit}（${percent}${label}${rest}）`;
      result.className = "g-result " + (r.ok ? "ok" : "ng");
    }

    if (r.autoCount === null) {
      auto.textContent = "関連する習慣がないので、実績は手入力です";
    } else {
      auto.textContent = `関連する習慣の完了: ${r.autoCount}${r.unit}` +
        (r.manual ? "（実績は手入力の値を使っています）" : "（実績として使っています）");
    }
  }

  // 目標の達成数（目標値を入れた目標のうち、達成率100%以上の数）
  function paintScore(keys) {
    const results = currentGoals().map(g => goalResult(g, keys)).filter(r => r.ok !== null);
    const achieved = results.filter(r => r.ok).length;
    document.getElementById("review-score").textContent = results.length === 0
      ? "目標値と実績を入れると、ここに達成数が出ます"
      : `目標の達成: ${achieved} / ${results.length}`;
  }

  // ---------- 描画: カレンダー ----------
  function renderCalendar() {
    const now = new Date();
    const todayStr = todayKey();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();

    document.getElementById("cal-title").textContent = `${viewYear}年${viewMonth + 1}月`;
    // 今月より先の月には進めない
    document.getElementById("next-month").disabled =
      viewYear * 12 + viewMonth >= now.getFullYear() * 12 + now.getMonth();

    const grid = document.getElementById("cal-grid");
    grid.innerHTML = "";
    WEEK.forEach(w => {
      const el = document.createElement("div");
      el.className = "cal-wd";
      el.textContent = w;
      grid.append(el);
    });
    for (let i = 0; i < firstWeekday; i++) grid.append(document.createElement("div"));

    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${viewYear}-${pad(viewMonth + 1)}-${pad(d)}`;
      const btn = document.createElement("button");
      btn.className = "cal-day";
      btn.textContent = d;
      const level = levelOf(key);
      if (level) btn.classList.add(`lv${level}`);
      if (key === todayStr) btn.classList.add("today");
      if (key === selectedKey) btn.classList.add("sel");
      btn.disabled = key > todayStr;
      btn.addEventListener("click", () => selectDay(key));
      grid.append(btn);
    }
  }

  function shiftMonth(delta) {
    const d = new Date(viewYear, viewMonth + delta, 1);
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    renderCalendar();
  }

  function selectDay(key) {
    if (key > todayKey()) return;
    selectedKey = key;
    const [y, m] = key.split("-").map(Number);
    viewYear = y;
    viewMonth = m - 1;
    render();
  }

  // ---------- タイマー ----------
  function loadTimer() {
    try {
      return JSON.parse(localStorage.getItem(TIMER_KEY));
    } catch (e) {
      return null;
    }
  }

  function saveTimer() {
    try {
      if (timer) localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
      else localStorage.removeItem(TIMER_KEY);
    } catch (e) { /* 保存できなくてもタイマーは動く */ }
  }

  function remainingMs() {
    if (!timer) return 0;
    return timer.endAt ? Math.max(0, timer.endAt - Date.now()) : timer.remainMs;
  }

  function renderTimer() {
    const panel = document.getElementById("timer-panel");
    panel.hidden = !timer;
    if (!timer) return;
    const sec = Math.ceil(remainingMs() / 1000);
    document.getElementById("timer-name").textContent = timer.name;
    document.getElementById("timer-time").textContent = `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
    document.getElementById("timer-pause").textContent = timer.endAt ? "一時停止" : "再開";
  }

  // 終了時刻は時刻で管理しているので、画面を閉じていた間も正しく進む
  function checkTimer() {
    if (timer && timer.endAt && Date.now() >= timer.endAt) finishTimer();
    else renderTimer();
  }

  function startTimer(h) {
    if (timer && !confirm(`「${timer.name}」のタイマーを止めて、「${h.name}」を始めますか？`)) return;
    try {
      // 音を鳴らすため、ボタンを押した時点で音声を有効にしておく
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
    } catch (e) { /* 音が出せなくても続ける */ }
    timer = {
      habitId: h.id,
      name: h.name,
      key: selectedKey,
      endAt: Date.now() + h.minutes * 60 * 1000,
      remainMs: null,
    };
    saveTimer();
    renderTimer();
  }

  function togglePause() {
    if (!timer) return;
    if (timer.endAt) {
      timer.remainMs = remainingMs();
      timer.endAt = null;
    } else {
      timer.endAt = Date.now() + timer.remainMs;
      timer.remainMs = null;
    }
    saveTimer();
    renderTimer();
  }

  function stopTimer() {
    timer = null;
    saveTimer();
    renderTimer();
  }

  function finishTimer() {
    const done = timer;
    timer = null;
    saveTimer();
    // 終了したら、その習慣をタイマーを始めた日の完了として記録する
    if (state.habits.some(h => h.id === done.habitId)) {
      state.records[done.key] = state.records[done.key] || {};
      state.records[done.key][done.habitId] = true;
      save();
    }
    beep();
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    render();
    renderTimer();
    alert(`「${done.name}」の時間になりました。完了として記録しました。`);
  }

  function beep() {
    if (!audioCtx) return;
    [0, 0.4, 0.8].forEach(t => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 880;
      gain.gain.value = 0.2;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + t);
      osc.stop(audioCtx.currentTime + t + 0.25);
    });
  }

  function timerButton(h) {
    const b = miniButton(`⏱ ${h.minutes}分`, false, () => startTimer(h));
    b.classList.add("timer-btn");
    return b;
  }

  // ---------- 操作: 習慣 ----------
  function toggle(id) {
    const key = selectedKey;
    state.records[key] = state.records[key] || {};
    if (state.records[key][id]) {
      delete state.records[key][id];
    } else {
      state.records[key][id] = true;
    }
    save();
    render();
  }

  function move(index, dir) {
    const target = index + dir;
    if (target < 0 || target >= state.habits.length) return;
    [state.habits[index], state.habits[target]] = [state.habits[target], state.habits[index]];
    save();
    render();
  }

  function remove(id) {
    const h = state.habits.find(x => x.id === id);
    if (!h || !confirm(`「${h.name}」を削除しますか？過去の記録からも消えます。`)) return;
    state.habits = state.habits.filter(x => x.id !== id);
    for (const key of Object.keys(state.records)) delete state.records[key][id];
    save();
    render();
  }

  function setMinutes(id) {
    const h = state.habits.find(x => x.id === id);
    if (!h) return;
    const input = prompt(`「${h.name}」の時間（分）。空欄にすると時間なしに戻します。`, h.minutes || "");
    if (input === null) return;
    if (input.trim() === "") {
      delete h.minutes;
    } else {
      const n = parseInt(input, 10);
      if (!(n >= 1 && n <= 600)) {
        alert("1〜600の数字を入れてください。");
        return;
      }
      h.minutes = n;
    }
    save();
    render();
  }

  // 習慣を目標に関連づける（番号で選ぶ）
  function setGoal(id) {
    const h = state.habits.find(x => x.id === id);
    const goals = currentGoals();
    if (!h) return;
    if (goals.length === 0) {
      alert("先に「今年の目標」を登録してください。");
      return;
    }
    const list = goals.map((g, i) => `${i + 1}: ${g.title}`).join("\n");
    const input = prompt(`「${h.name}」を関連づける目標の番号を入れてください。\n0: 目標なし\n${list}`, "");
    if (input === null || input.trim() === "") return;
    const n = parseInt(input, 10);
    if (n === 0) {
      delete h.goalId;
    } else if (n >= 1 && n <= goals.length) {
      h.goalId = goals[n - 1].id;
    } else {
      alert("番号が正しくありません。");
      return;
    }
    save();
    render();
  }

  // ---------- 操作: 目標 ----------
  function removeGoal(id) {
    const g = state.goals.find(x => x.id === id);
    if (!g || !confirm(`目標「${g.title}」を削除しますか？ 関連していた習慣は「目標なし」になります。`)) return;
    state.goals = state.goals.filter(x => x.id !== id);
    state.habits.forEach(h => {
      if (h.goalId === id) delete h.goalId;
    });
    save();
    render();
  }

  // ---------- 操作: ToDo ----------
  function toggleTodo(id) {
    const t = (state.todos[selectedKey] || []).find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    save();
    render();
  }

  function removeTodo(id) {
    state.todos[selectedKey] = (state.todos[selectedKey] || []).filter(x => x.id !== id);
    save();
    render();
  }

  function render() {
    renderCalendar();
    renderGoals();
    renderGoalOptions();
    renderToday();
    renderTodos();
    renderChart();
    renderReview();
    renderTimer();
  }

  // ---------- フォーム・ボタン ----------
  document.getElementById("goal-form").addEventListener("submit", e => {
    e.preventDefault();
    const titleInput = document.getElementById("goal-title");
    const whyInput = document.getElementById("goal-why");
    const title = titleInput.value.trim();
    if (!title) return;
    state.goals.push({ id: uid(), title, why: whyInput.value.trim(), year: THIS_YEAR });
    titleInput.value = "";
    whyInput.value = "";
    save();
    render();
  });

  document.getElementById("add-form").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("new-name");
    const name = input.value.trim();
    if (!name) return;
    const minutesInput = document.getElementById("new-minutes");
    const goalSelect = document.getElementById("new-goal");
    const habit = { id: uid(), name };
    const minutes = parseInt(minutesInput.value, 10);
    if (minutes >= 1 && minutes <= 600) habit.minutes = minutes;
    if (goalSelect.value) habit.goalId = goalSelect.value;
    state.habits.push(habit);
    input.value = "";
    minutesInput.value = "";
    goalSelect.value = "";
    save();
    render();
  });

  document.getElementById("todo-form").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("todo-name");
    const name = input.value.trim();
    if (!name) return;
    state.todos[selectedKey] = state.todos[selectedKey] || [];
    state.todos[selectedKey].push({ id: uid(), name, done: false });
    input.value = "";
    save();
    render();
  });

  document.getElementById("prev-month").addEventListener("click", () => shiftMonth(-1));
  document.getElementById("next-month").addEventListener("click", () => shiftMonth(1));
  document.getElementById("to-today").addEventListener("click", () => selectDay(todayKey()));

  document.getElementById("edit-toggle").addEventListener("click", e => {
    editing = !editing;
    e.currentTarget.textContent = editing ? "完了" : "並べ替え・削除";
    renderToday();
  });

  document.querySelectorAll("#range button").forEach(btn => {
    btn.addEventListener("click", () => {
      chartDays = Number(btn.dataset.days);
      document.querySelectorAll("#range button").forEach(b => b.classList.toggle("on", b === btn));
      renderChart();
    });
  });

  document.querySelectorAll("#review-q button").forEach(btn => {
    btn.addEventListener("click", () => {
      reviewQuarter = Number(btn.dataset.q);
      renderReview();
    });
  });

  // 振り返りの文章は入力するたびに保存する（再描画すると入力が途切れるため、描画は行わない）
  [["rv-good", "good"], ["rv-issues", "issues"], ["rv-next", "next"]].forEach(([id, field]) => {
    document.getElementById(id).addEventListener("input", e => {
      reviewFor(reviewKey())[field] = e.target.value;
      save();
    });
  });

  document.getElementById("timer-pause").addEventListener("click", togglePause);
  document.getElementById("timer-stop").addEventListener("click", stopTimer);

  document.getElementById("export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `habits-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  const importFile = document.getElementById("import-file");
  document.getElementById("import-btn").addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", async () => {
    const file = importFile.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.habits) || typeof data.records !== "object") throw new Error("format");
      if (!confirm("現在のデータを読み込んだデータで置き換えます。よろしいですか？")) return;
      state = normalize(data);
      save();
      render();
    } catch (e) {
      alert("読み込めないファイルです。書き出したJSONを選んでください。");
    } finally {
      importFile.value = "";
    }
  });

  // 日付が変わったら今日の表示を更新
  let lastKey = todayKey();
  setInterval(() => {
    if (todayKey() !== lastKey) {
      // 今日を見ていた場合は、新しい今日に切り替える
      if (selectedKey === lastKey) selectedKey = todayKey();
      lastKey = todayKey();
      render();
    }
  }, 60 * 1000);

  selectedKey = todayKey();
  viewYear = new Date().getFullYear();
  viewMonth = new Date().getMonth();
  render();

  setInterval(() => { if (timer) checkTimer(); }, 500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkTimer(); });
  checkTimer();
})();
</script>
</body>
</html>
